name: Đóng gói app

# Khi mã nguồn trên nhánh main thay đổi: tạo lại index.html, van-ban-den.html rồi lưu vào kho.
# GitHub Pages tự đăng bản mới sau khoảng 1 phút. Không sửa tay 2 tệp đó.
on:
  push:
    branches: [main]
    paths:
      - 'nguon/**'
      - 'dong_goi.py'
      - 'thu-vien/package.json'
      - 'thu-vien/package-lock.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dong-goi-app
  cancel-in-progress: false

jobs:
  dong-goi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cài thư viện đúng phiên bản đã khóa
        working-directory: thu-vien
        run: npm ci --ignore-scripts

      - name: Đóng gói
        run: python dong_goi.py

      - name: Lưu vào kho nếu có thay đổi
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html van-ban-den.html
          if git diff --cached --quiet; then echo "Không có thay đổi."; exit 0; fi
          git commit -m "Đóng gói app từ mã nguồn"
          for i in 1 2 3 4; do git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push && exit 0; sleep $((i*3)); done
          exit 1
